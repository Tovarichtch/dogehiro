name: build

on:
  push:
    branches: [main]     # other branches run through their pull request: one run per change
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest,   name: macos }
    steps:
      - uses: actions/checkout@v4

      - name: Web engine headers (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # tar and ditto keep the program runnable; a plain upload drops that permission
      - name: Pack
        shell: bash
        run: |
          mkdir out
          case "${{ matrix.name }}" in
            linux)   tar -czf out/dogehiro-linux.tar.gz -C build dogehiro ;;
            macos)   ditto -c -k --keepParent build/dogehiro.app out/dogehiro-macos.zip ;;
            windows) cp build/Release/dogehiro.exe out/ ;;
          esac

      - name: Keep the program
        uses: actions/upload-artifact@v4
        with:
          name: dogehiro-${{ matrix.name }}
          path: out
          retention-days: 2
